name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Unpack project
        run: unzip -q ejet_mcdu.zip
      - name: Build
        working-directory: ejet_mcdu
        run: |
          flutter create --org com.example --project-name ejet_mcdu .
          printf '%s\n' "subprojects {" "  afterEvaluate { p ->" "    if (p.hasProperty('android')) { p.android.compileSdkVersion 36 }" "  }" "}" > android/fix.gradle
          if [ -f android/build.gradle.kts ]; then sed -i '1i apply(from = "fix.gradle")' android/build.gradle.kts; else sed -i "1i apply from: 'fix.gradle'" android/build.gradle; fi
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.VIBRATE"/>\n    <application#' android/app/src/main/AndroidManifest.xml
          flutter pub get
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: ejet-mcdu-apk
          path: ejet_mcdu/build/app/outputs/flutter-apk/app-release.apk
